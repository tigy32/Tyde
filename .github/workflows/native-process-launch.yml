name: Native process launch

on:
  push:
    branches: [main]
    paths:
      - 'process-env/**'
      - 'Cargo.lock'
      - '.github/workflows/native-process-launch.yml'
  pull_request:
    paths:
      - 'process-env/**'
      - 'Cargo.lock'
      - '.github/workflows/native-process-launch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the production exec-helper entrypoint
        run: cargo build --locked -p tyde-process-env --example launch_probe --features test-support
      - name: Initialize the login-shell PATH
        run: |
          for login_shell in /bin/bash /bin/zsh; do
            SHELL="$login_shell" target/debug/examples/launch_probe
          done
      - name: Exercise startup from a background terminal
        # The repository's nextest profile owns the per-test hung guard.
        uses: taiki-e/install-action@nextest
      - name: Verify background startup and descendant cleanup
        shell: bash
        run: |
          export TYDE_TEST_PROCESS_EXECUTABLE="$PWD/target/debug/examples/launch_probe"
          cargo nextest run --locked -p tyde-process-env --features test-support --test login_shell
