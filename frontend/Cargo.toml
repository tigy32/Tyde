[package]
name = "frontend"
edition.workspace = true

[dependencies]
protocol = { path = "../protocol", default-features = false }
devtools-protocol = { path = "../devtools-protocol", default-features = false }
host-config = { path = "../host-config" }
leptos = { version = "0.8.17", features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "CaretPosition",
    # `crypto.getRandomValues` mints the voice session id, which is the
    # capability naming the /voice/<id> stream. `Math.random` is not a CSPRNG
    # and is not acceptable for it.
    "Crypto",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlBodyElement",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlScriptElement",
    "HtmlStyleElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEvent",
    "MouseEventInit",
    "PointerEvent",
    "PointerEventInit",
    # Voice layer: microphone capture, one bidirectional WebRTC audio track,
    # and a hidden <audio> element for remote playback. Remote audio is played
    # as a live WebRTC track rather than decoded through Web Audio, because
    # platform echo cancellation only cancels far-end audio the media stack
    # owns — which is why there is no AudioContext/AudioWorklet here.
    "HtmlAudioElement",
    "HtmlMediaElement",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaTrackConstraints",
    "MediaTrackSettings",
    "RtcConfiguration",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcPeerConnectionState",
    # Required by `RtcPeerConnection::add_track`, which returns a sender.
    "RtcRtpSender",
    "RtcSdpType",
    "RtcSessionDescriptionInit",
    "RtcTrackEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Performance",
    "Range",
    "Selection",
    "ProgressEvent",
    "Storage",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "console",
] }
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
similar = { version = "2", default-features = false, features = ["text"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
once_cell = "1"
qrcodegen = "1.8"

[dev-dependencies]
wasm-bindgen-test = "0.3"
