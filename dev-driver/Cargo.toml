[package]
name = "tyde-dev-driver"
edition.workspace = true

[dependencies]
tyde-process-env = { path = "../process-env" }
client = { path = "../client" }
command-group = { version = "5", features = ["with-tokio"] }
devtools-protocol = { path = "../devtools-protocol" }
protocol = { path = "../protocol" }
settings-model = { path = "../settings-model" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
server = { path = "../server" }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
