# cargo-nextest configuration.
#
# nextest runs each test in its own process and parallelizes across *all* test
# binaries at once (plain `cargo test` runs binaries one after another), which
# is the main reason the integration suite is much faster under nextest.
#
# The canonical wrapper invokes nextest. Do not run this stage directly; use
# `./dev.sh check` so repetition, hung-test protection, compact logs, and cleanup apply.

nextest-version = "0.9.113"
experimental = ["wrapper-scripts"]

[scripts.wrapper.macos-test-binary]
command = { command-line = "tools/run-nextest-binary.sh", relative-to = "workspace-root" }

# macOS test binaries are cloned outside the enormous shared target directory
# to avoid dyld paging stalls. The wrapper keys clones by logical test target,
# removes superseded identities, and safely recovers locks left by dead copiers.

# Start the deliberate long startup regression early, overlapping other flows.
[[profile.default.overrides]]
filter = 'binary_id(server::dev_instances)'
priority = 100

[[profile.ci.overrides]]
filter = 'binary_id(server::dev_instances)'
priority = 100

# These tests intentionally exercise real CLI probes at tight process timeout
# boundaries. Reserve the runner while they probe so unrelated process-heavy
# tests cannot consume the deadline of healthy fake executables.
[[profile.default.overrides]]
filter = 'binary_id(server::settings) & test(backend_setup_payload_reports_found_unusable_hermes_cli)'
threads-required = "num-test-threads"
success-output = "final"

[[profile.ci.overrides]]
filter = 'binary_id(server::settings) & test(backend_setup_payload_reports_found_unusable_hermes_cli)'
threads-required = "num-test-threads"
success-output = "final"

# Reserve the process-heavy worktree and native Hermes settings flows.
[[profile.default.overrides]]
filter = 'binary_id(server::swarms) & test(workspace_scopes_authorize_current_projects_workbenches_and_resume_roots) | binary_id(server::settings) & (test(settings_write_enabled_backends_refreshes_schemas_and_config_snapshots) | test(hermes_save_is_not_blocked_by_a_stale_untouched_profile_value) | test(settings_write_lifecycle_is_serialized_across_writers))'
threads-required = "num-test-threads"
success-output = "final"

[[profile.ci.overrides]]
filter = 'binary_id(server::swarms) & test(workspace_scopes_authorize_current_projects_workbenches_and_resume_roots) | binary_id(server::settings) & (test(settings_write_enabled_backends_refreshes_schemas_and_config_snapshots) | test(hermes_save_is_not_blocked_by_a_stale_untouched_profile_value) | test(settings_write_lifecycle_is_serialized_across_writers))'
threads-required = "num-test-threads"
success-output = "final"

# Keep startup ordering evidence even when the intermittent side-question race passes.
[[profile.default.overrides]]
filter = 'binary_id(server::swarms) & test(explicit_legacy_conversion_requires_quiescence_and_preserves_sessions_without_transcript_posts)'
success-output = "final"

[[profile.default.overrides]]
filter = 'binary_id(server::side_questions) & test(btw_sessions_recover_after_model_catalog_changes)'
success-output = "final"

# Retain the live-vs-bootstrap evidence for the plan-approval setup race.
[[profile.default.overrides]]
filter = 'binary_id(server::agents) & test(agent_control_http_await_stays_active_after_exit_plan_mode_approval)'
success-output = "final"

# Retain payload-free attachment and idle-wait evidence for Help controls.
[[profile.default.overrides]]
filter = 'binary_id(server::agents) & test(help_controls_top_level_agents_across_projects)'
success-output = "final"

# Retain compact measured review payload and context-reuse counts.
[[profile.default.overrides]]
filter = 'binary_id(server::review) & (test(advisory_review_reuses_context_and_keeps_compact_audit) | test(advisory_review_does_not_depend_on_full_context_transport))'
success-output = "final"

# Retain safe frame-order evidence for the review parent-close flow.
[[profile.default.overrides]]
filter = 'binary_id(server::review) & test(advisory_review_reattaches_and_exposes_failures_and_configuration_changes)'
success-output = "final"

# Measure the real protocol hot path without competing process-heavy tests.
[[profile.default.overrides]]
filter = 'binary_id(server::session_resume) & test(mobile_open_many_agents_keeps_ancient_transcripts_off_the_hot_path)'
threads-required = "num-test-threads"
success-output = "final"

[[profile.ci.overrides]]
filter = 'binary_id(server::session_resume) & test(mobile_open_many_agents_keeps_ancient_transcripts_off_the_hot_path)'
threads-required = "num-test-threads"
success-output = "final"

# Retain content-safe native-loss/protocol milestones for this regression.
[[profile.default.overrides]]
filter = 'binary_id(server::projects) & test(project_watcher_follows_worktree_git_metadata)'
success-output = "final"

[[profile.ci.overrides]]
filter = 'binary_id(server::projects) & test(project_watcher_follows_worktree_git_metadata)'
success-output = "final"
retries = 0

[profile.default]
# Five minutes is a suite optimization target, not a deadline. Only an
# individual test running for ten minutes is terminated as hung.
slow-timeout = { period = "60s", terminate-after = 10 }
retries = 0
fail-fast = false
# Keep the source runner concise; dev.sh retains the complete repetition log
# and replays the complete failing repetition when this stage fails.
status-level = "slow"
final-status-level = "slow"
success-output = "never"
failure-output = "final"

[[profile.default.scripts]]
filter = "all()"
platform = 'cfg(target_os = "macos")'
list-wrapper = "macos-test-binary"
run-wrapper = "macos-test-binary"

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 10 }
# Retry flaky tests a couple of times before declaring failure, and keep going
# after the first failure so one bad test doesn't mask others.
retries = 2
fail-fast = false
status-level = "slow"
final-status-level = "slow"
success-output = "never"
failure-output = "final"

[[profile.ci.scripts]]
filter = "all()"
platform = 'cfg(target_os = "macos")'
list-wrapper = "macos-test-binary"
run-wrapper = "macos-test-binary"

# Paid conformance is opt-in and has the same per-test hung protection. A
# longer total run must not discard completed work or interrupt healthy tests.
[profile.conformance]
slow-timeout = { period = "120s", terminate-after = 5 }
# A paid run costs money to repeat: never retry silently, and never let one red
# scenario hide the state of the others.
retries = 0
fail-fast = false
status-level = "slow"
final-status-level = "slow"
success-output = "never"
failure-output = "final"

[[profile.conformance.scripts]]
filter = "all()"
platform = 'cfg(target_os = "macos")'
list-wrapper = "macos-test-binary"
run-wrapper = "macos-test-binary"

# Retain causal evidence: independent protocol work finishes before held I/O is released.
[[profile.default.overrides]]
filter = 'binary_id(server::workbenches) & (test(workbench_create_and_remove_round_trip_real_git_repo) | test(workbench_remove_cascades_agents_terminals_sessions_and_steering)) | binary_id(server::projects) & (test(add_root_emits_updated_upsert) | test(create_project_emits_upsert)) | binary_id(server::session_resume) & test(session_reads_remain_responsive_during_uncommitted_write) | binary_id(server::supervisor) & test(replacement_compaction_reports_required_close_failure)'
success-output = "final"

[[profile.ci.overrides]]
filter = 'binary_id(server::workbenches) & (test(workbench_create_and_remove_round_trip_real_git_repo) | test(workbench_remove_cascades_agents_terminals_sessions_and_steering)) | binary_id(server::projects) & (test(add_root_emits_updated_upsert) | test(create_project_emits_upsert)) | binary_id(server::session_resume) & test(session_reads_remain_responsive_during_uncommitted_write) | binary_id(server::supervisor) & test(replacement_compaction_reports_required_close_failure)'
success-output = "final"

# Retain state/event evidence for the returned watcher flow.
[[profile.default.overrides]]
filter = 'binary_id(server::projects) & test(project_watcher_prunes_ignored_build_trees)'
success-output = "final"

[[profile.ci.overrides]]
filter = 'binary_id(server::projects) & test(project_watcher_prunes_ignored_build_trees)'
success-output = "final"
retries = 0

# Retain payload-free frontend producer/scenario event ordering.
[[profile.default.overrides]]
filter = 'binary_id(server::dev_instances) & test(dev_instance_claude_writes_stay_out_of_parent_claude_home)'
success-output = "final"

[[profile.ci.overrides]]
filter = 'binary_id(server::dev_instances) & test(dev_instance_claude_writes_stay_out_of_parent_claude_home)'
success-output = "final"
retries = 0

# Retain state/event evidence for the returned pin-publication flow.
[[profile.default.overrides]]
filter = 'binary_id(server::agents_view_preferences) & test(agents_view_preferences_agent_pins_canonicalize_and_persist_session_targets)'
success-output = "final"

[[profile.ci.overrides]]
filter = 'binary_id(server::agents_view_preferences) & test(agents_view_preferences_agent_pins_canonicalize_and_persist_session_targets)'
success-output = "final"
retries = 0
