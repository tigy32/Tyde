[package]
name = "tyde-server"
version = "0.9.6-beta.15"
edition.workspace = true

[[bin]]
name = "tyde-server"
path = "src/main.rs"

[dependencies]
server = { path = "../server" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

[dev-dependencies]
host-config = { path = "../host-config" }
protocol = { path = "../protocol" }
rmcp = { version = "0.15.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json.workspace = true
tempfile = "3"
