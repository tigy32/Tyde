[package]
name = "server"
edition.workspace = true

[features]
default = []
full-backends = []
test-support = []

[dependencies]
tyde-agent-adapter = { path = "../agent-adapter" }
aes-gcm = "0.10"
anyhow = "1"
blake2 = "0.10"
hkdf = "0.12"
futures-util = "0.3"
fs2 = "0.4"
hmac = "0.12"
client = { path = "../client" }
devtools-protocol = { path = "../devtools-protocol" }
protocol = { path = "../protocol" }
settings-model = { path = "../settings-model" }
mqtt-transport = { path = "../mqtt-transport" }
axum = "0.8"
base64 = "0.22"
command-group = { version = "5", features = ["with-tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
indexmap = "2"
regex = "1"
same-file = "1"
notify = "8"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rmcp = { version = "0.15.0", default-features = false, features = ["client", "macros", "reqwest-tls-no-provider", "schemars", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio.workspace = true
tokio-util = "0.7"
url = "2"
tracing.workspace = true
uuid.workspace = true
opus = "0.3"
aws-config = "1"
aws-sdk-bedrockruntime = "1"
aws-smithy-types = "1"
aws-types = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
server = { path = ".", features = ["test-support"] }
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
sha2 = "0.10"
client = { path = "../client" }
tyde-dev-driver = { path = "../dev-driver" }
mqtt-transport = { path = "../mqtt-transport", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
rmcp = { version = "0.15.0", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
