[package]
name = "server"
edition.workspace = true

[features]
default = []
full-backends = []
test-support = []

[dependencies]
anyhow = "1"
aws-config = "1.10.1"
aws-sdk-bedrockruntime = "1.138.0"
aws-smithy-http = "0.64.0"
aws-smithy-types = "1.6.1"
aws-types = "1.5.0"
blake2 = "0.10"
futures-util = "0.3"
fs2 = "0.4"
hmac = "0.12"
client = { path = "../client" }
devtools-protocol = { path = "../devtools-protocol" }
protocol = { path = "../protocol" }
mqtt-transport = { path = "../mqtt-transport" }
axum = "0.8"
base64 = "0.22"
audiopus_sys = { version = "0.2.2", features = ["static"] }
command-group = { version = "5", features = ["with-tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
indexmap = "2"
mdns-sd = { version = "0.20.3", default-features = false, features = ["async"] }
regex = "1"
notify = "8"
opus = "0.3.0"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rmcp = { version = "0.15.0", default-features = false, features = ["client", "macros", "reqwest-tls-no-provider", "schemars", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2 = "0.10"
str0m = { version = "0.21.0", default-features = false, features = ["aws-lc-rs"] }
tempfile = "3"
tokio.workspace = true
tokio-util = "0.7"
url = "2"
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
mqtt-transport = { path = "../mqtt-transport", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
