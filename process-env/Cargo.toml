[package]
name = "tyde-process-env"
edition.workspace = true

[features]
test-support = []

[dependencies]
protocol = { path = "../protocol", default-features = false }
anyhow = "1"
portable-pty = "0.8"
command-group = { version = "5", features = ["with-tokio"] }
tokio-util = "0.7"
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"

[dev-dependencies]
tracing-subscriber = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = {version="0.25.1",features=["term"],default-features=false}

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["handleapi", "ioapiset", "jobapi2", "processthreadsapi", "tlhelp32", "winbase", "winnt", "winerror"] }

