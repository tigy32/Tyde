[package]
name = "tests"
edition.workspace = true

[dependencies]
client = { path = "../client" }
protocol = { path = "../protocol" }
settings-model = { path = "../settings-model" }
mobile-pairing = { path = "../mobile-pairing" }
server = { path = "../server", features = ["test-support"] }
tyde-dev-driver = { path = "../dev-driver" }
tyde-agent-adapter = { path = "../agent-adapter" }
futures-util = "0.3"
axum = "0.8"
base64.workspace = true
paste = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rmcp = { version = "0.15.0", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.29"
uuid.workspace = true
opus = "0.3.1"

rtc-transport = { path = "../rtc-transport" }
turn = "0.17.2"
webrtc-util = { version = "0.17.1", features = ["vnet"] }
tokio-rustls = "0.26"
rcgen = "0.14"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
