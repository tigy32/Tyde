[package]
name = "tests"
edition.workspace = true

[dependencies]
client = { path = "../client" }
protocol = { path = "../protocol" }
mqtt-transport = { path = "../mqtt-transport", features = ["test-support"] }
server = { path = "../server", features = ["test-support"] }
tyde-dev-driver = { path = "../dev-driver" }
tyde-agent-adapter = { path = "../agent-adapter" }
futures-util = "0.3"
axum = "0.8"
paste = "1"
rmcp = { version = "0.15.0", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
rumqttd = "0.20.0"
opus = "0.3.1"

[dev-dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
