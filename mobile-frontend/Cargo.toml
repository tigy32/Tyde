[package]
name = "mobile-frontend"
edition.workspace = true

[features]
default = []
ui-fixtures = []

[dependencies]
tyde-time = { path = "../time" }
protocol = { path = "../protocol" }
settings-model = { path = "../settings-model" }
host-config = { path = "../host-config" }
mobile-shell-types = { path = "../mobile-shell-types" }
# Pairing identities and keys shared by the browser and native builds.
# The native target also compiles this so the runtime-detect shell
# builds without any cfg split; only the wasm bundle actually runs the web path.
mobile-pairing = { path = "../mobile-pairing" }
rtc-transport = { path = "../rtc-transport" }
leptos = { version = "0.8.17", features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
uuid = { version = "1", features = ["v4", "js"] }
sha2 = "0.11.0"
p256 = "0.13"
base64 = { workspace = true }
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Clipboard",
    "CanvasRenderingContext2d",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "Event",
    "Element",
    "EventTarget",
    "History",
    "HtmlCanvasElement",
    "HtmlDetailsElement",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "ImageData",
    "MouseEvent",
    "Touch",
    "TouchEvent",
    "TouchList",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaDevices",
    "MediaTrackConstraints",
    "MediaTrackSettings",
    "AudioContext",
    "AudioWorklet",
    "AudioWorkletNode",
    "CssStyleDeclaration",
    "DomRect",
    "HtmlHeadElement",
    "HtmlScriptElement",
    "Navigator",
    "Node",
    "Notification",
    "NotificationPermission",
    "PushEncryptionKeyName",
    "PushManager",
    "PushSubscription",
    "PushSubscriptionOptions",
    "PushSubscriptionOptionsInit",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "NodeList",
    "Screen",
    "Storage",
    "VisualViewport",
    "MediaQueryList",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Window",
    "WebSocket",
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "MessageEvent",
    "Headers",
    "Location",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "Url",
    "UrlSearchParams",
    "console",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbDatabase",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbObjectStore",
    "IdbVersionChangeEvent",
    "DomException",
    "DomStringList",
    "Blob",
    "File",
    "FileList",
    "HtmlInputElement",
    "HtmlSelectElement",
] }
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
send_wrapper = "0.6"
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util"] }

[dev-dependencies]
web-sys = { version = "0.3", features = ["HtmlIFrameElement"] }
wasm-bindgen-test = "0.3"
